<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap"
    />
    <meta name="robots" content="noindex" />
    <title>In Your Nature · Portal</title>
    <script>
      // On GitHub Pages, deep links like /portal/invite/abc hit the site's 404.html, which sends them
      // here as /portal/?p=<original path>. Put the original URL back before the app reads it.
      ;(function () {
        var p = new URLSearchParams(location.search).get('p')
        if (p && p.charAt(0) === '/' && p.charAt(1) !== '/') history.replaceState(null, '', p)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
