name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portal/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Custom domain (getinyournature.com) is served from the root, so the
      # default base of '/' in vite.config.js applies.
      - run: npm run build

      # The client portal is its own Vite app, built for /portal/ and placed inside the site.
      # GitHub Pages can't proxy, so it calls the backend directly at the URL in the
      # PORTAL_API_URL repository variable (Settings > Secrets and variables > Actions > Variables).
      - name: Build client portal
        working-directory: portal
        env:
          VITE_API_URL: ${{ vars.PORTAL_API_URL }}
        run: |
          npm ci
          npm run lint
          npm run build
      - run: cp -r portal/dist dist/portal

      # Pages has no SPA fallback: 404.html is the site's index.html, so deep
      # links like /about load the app and the router takes over. Links under
      # /portal/ are forwarded to the portal app instead.
      - run: node scripts/make-404.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
